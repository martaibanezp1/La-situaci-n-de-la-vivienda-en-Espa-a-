<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stradivarius Style - Marta Ibáñez Pozo</title>
    <style>
        /* Estilos generales con fondo rosa y letras blancas */
        body {
            background-color: pink; /* Fondo rosa */
            color: white; /* Letras en blanco */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            text-align: center;
        }

        /* Cabecera minimalista inspirada en Stradivarius */
        header {
            width: 100%;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 1.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0;
            font-weight: 700;
        }

        /* Contenido principal */
        main {
            padding: 20px;
            max-width: 800px;
        }

        h2 {
            font-size: 2.2rem;
            font-weight: 300; /* Estilo editorial fino */
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        h3 {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 1px;
        }

        /* Contenedor del vídeo con estética limpia */
        .video-container {
            margin: 40px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        iframe {
            max-width: 100%;
            border: none;
        }

        /* Pie de página */
        footer {
            width: 100%;
            padding: 20px 0;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>Stradivarius Inspired</h1>
    </header>

    <main>
        <h2>¡Hola, mundo!</h2>
        <h3>Marta Ibáñez Pozo.</h3>

        <!-- Vídeo de YouTube incrustado en la parte inferior -->
        <div class="video-container">
            <iframe width="560" height="315" src="https://www.youtube.com/embed/zqEs0w-h7lQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 - Todos los derechos reservados</p>
        <p>POR FIN ES VIERNES</p>
    </footer>

</body>
</html>
